<!doctype html><html lang="ja"><meta charset="utf-8"><title>百代鏡・右向き待機歩行</title><style>body{background:#202a31;color:#eee;font:16px system-ui;margin:28px}h1{font-size:24px}canvas{background:#bcc0b6;image-rendering:pixelated}#big{width:256px;height:384px}.row{display:flex;gap:60px;align-items:flex-end}label{display:inline-block;margin:10px}button,select{padding:8px;margin:5px}.note{color:#d9c393;max-width:1000px;line-height:1.7}</style><h1>右向き・待機 / 歩行の試作</h1><p class="note">64×96・1倍。左側が手前。近側と遠側の腕・脚は逆位相、刀は腰に追従。表示確認用の足踏みで、世界時間や部隊移動は進めません。遠側甲冑は同寸の近側素材から補った暫定面です。</p><div class="row"><div><p>原寸・1倍</p><canvas id="native" width="64" height="96"></canvas></div><div><p>4倍・接合確認用</p><canvas id="big" width="64" height="96"></canvas></div></div><p id="status"></p><div id="controls"></div><p><button id="all">全部戻す</button><button id="bare">裸素体</button><select id="clip"><option value="walk">歩行</option><option value="idle">待機</option></select><select id="speed"><option value="1">通常</option><option value="0.25">1/4速</option></select><button id="pause">一時停止 / 再開</button><button id="step">1コマ送る</button></p><script>const D=__DATA__;const tex={};let selected=new Set(D.keys),walking=true,frame=0,playing=true,speed=1,elapsed=0,last=0;function over(a,b){for(let i=0;i<a.length;i+=4)if(b[i+3])a.set(b.subarray(i,i+4),i)}function pixels(flags,index){const a=new Uint8ClampedArray(64*96*4),on=k=>(flags&(1<<D.keys.indexOf(k)))!==0;for(const o of D.operations){if(o.when&&!on(o.when)||o.unless&&on(o.unless))continue;const b=tex[o.sheet][index];if(o.erase){for(let i=0;i<a.length;i+=4)if(b[i+3])a.fill(0,i,i+4)}else over(a,b)}return a}function flags(){return D.keys.reduce((v,k,i)=>v|(selected.has(k)?1<<i:0),0)}function draw(){const index=(walking?4:0)+frame,a=pixels(flags(),index);for(const id of ['native','big'])document.getElementById(id).getContext('2d').putImageData(new ImageData(a,64,96),0,0);document.getElementById('status').textContent=`64×96 / 1倍　${walking?'歩行':'待機'} ${frame+1}/${walking?8:4}　速度 ${speed}　${selected.size}/10部位`;return a}function setParts(ns){selected=new Set(ns);for(const c of document.querySelectorAll('input'))c.checked=selected.has(c.dataset.part);draw()}async function init(){await Promise.all(Object.entries(D.images).map(async([n,url])=>{const im=new Image;im.src=url;await im.decode();const c=document.createElement('canvas');c.width=768;c.height=96;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);tex[n]=Array.from({length:12},(_,i)=>ctx.getImageData(i*64,0,64,96).data)}));for(const[k,i]of D.keys.map((k,i)=>[k,i])){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.dataset.part=k;c.onchange=()=>{c.checked?selected.add(k):selected.delete(k);draw()};l.append(c,D.labels[i]);document.getElementById('controls').append(l)}document.getElementById('all').onclick=()=>setParts(D.keys);document.getElementById('bare').onclick=()=>setParts([]);document.getElementById('clip').onchange=e=>{walking=e.target.value==='walk';frame=0;elapsed=0;draw()};document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('pause').onclick=()=>playing=!playing;document.getElementById('step').onclick=()=>{playing=false;frame=(frame+1)%(walking?8:4);draw()};draw();window.review={ready:true,pixels:(f,i)=>Array.from(pixels(f,i)),keys:D.keys,expected:D.hashes,setParts,setFrame:(index)=>{playing=false;walking=index>=4;frame=walking?index-4:index;return Array.from(draw())},play:(slow)=>{playing=true;walking=true;speed=slow;frame=0;elapsed=0;draw()}};requestAnimationFrame(tick)}function tick(t){if(last&&playing){elapsed+=(t-last)*speed;const duration=walking?D.walk_duration_ms:D.idle_duration_ms;while(elapsed>=duration){elapsed-=duration;frame=(frame+1)%(walking?8:4)}draw()}last=t;requestAnimationFrame(tick)}init();</script></html>
