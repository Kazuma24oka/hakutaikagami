<h1>右向き・静止パーツ試作 / 64×96・1倍</h1><p class="note">画面右向き＝武将の左側が手前。正面は従来素材のまま。下の動きは肘付近を左右1画素動かす接合確認で、歩行ではありません。素体は暫定、隠れ面の一部は単色の補完です。</p><div class="row"><div><p>原寸・1倍</p><div id="stage"><div><canvas id="front" width="64" height="96"></canvas><p>正面</p></div><div><canvas id="native" width="64" height="96"></canvas><p>右向き</p></div></div></div><div><p>4倍・検査用</p><canvas id="big" width="64" height="96"></canvas></div></div><p id="status"></p><div id="controls"></div><p><button id="all">全部戻す</button><button id="bare">裸素体のみ</button><button id="probe">接合確認を動かす</button><button id="still">静止へ戻す</button></p><p class="note">甲冑8部位＋顔・髪を独立切替。全部戻すと右向き元絵に0画素差で復元。全1024通りを検査。横歩行・反対側・背面・Godotへの右向き追加は次の工程です。</p>
