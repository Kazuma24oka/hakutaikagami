te(part);render()};l.append(e,groupLabels[key]);document.getElementById('groups').append(l)}for(let key of order){let l=document.createElement('label'),e=document.createElement('input');e.type='checkbox';e.dataset.part=key;e.onchange=()=>{e.checked?enabled.add(key):enabled.delete(key);render()};l.append(e,labels[key]);document.getElementById('parts').append(l)}document.getElementById('tone').onchange=e=>window.layerReview.setTone(e.target.value);document.getElementById('restore').onclick=()=>choose(order);document.getElementById('hide').onclick=()=>choose([]);render();window.layersReady=true})().catch(e=>{document.getElementById('status').textContent=e.message;throw e});</script></main></html>
