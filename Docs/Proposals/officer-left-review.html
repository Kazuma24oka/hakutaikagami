<h1>左向き・静止パーツ試作 / 64×96・1倍</h1><p class="note">画面左向き＝武将の左側が手前。正面は従来素材のまま。下の動きは肘付近を左右1画素動かす接合確認で、歩行ではありません。素体は暫定、隠れ面の一部は単色の補完です。</p><div class="row"><div><p>原寸・1倍</p><div id="stage"><div><canvas id="front" width="64" height="96"></canvas><p>正面</p></div><div><canvas id="native" width="64" height="96"></canvas><p>左向き</p></div></div></div><div><p>4倍・検査用</p><canvas id="big" width="64" height="96"></canvas></div></div><p id="status"></p><div id="controls"></div><p><button id="all">全部戻す</button><button id="bare">裸素体のみ</button><button id="probe">接合確認を動かす</button><button id="still">静止へ戻す</button></p><p class="note">甲冑8部位＋顔・髪を独立切替。全部戻すと左向き元絵に0画素差で復元。全1024通りを検査。左向きの歩行とGodot組込みは次の工程です。</p>

function roundEven(x){const f=Math.floor(x),r=x-f;return r===.5?(f%2===0?f:f+1):Math.round(x)}
function warped(a,n){if(!n)return a;const b=new Uint8ClampedArray(a.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const wy=Math.max(0,1-Math.abs(y-53)/17),wx=Math.max(0,1-Math.abs(x-34)/10),sx=roundEven(x-n*wy*wx);if(sx>=0&&sx<W)b.set(a.subarray((y*W+sx)*4,(y*W+sx+1)*4),(y*W+x)*4)}return b}
function compose(){const a=new Uint8ClampedArray(tex.body.length);if(selected.has('sword'))over(a,tex.sword);over(a,tex.body);for(const n of selected){const m=tex['hide_'+n];if(m)for(let i=0;i<a.length;i+=4)if(m[i+3])a.fill(0,i,i+4)}for(const n of DATA.order){if(n==='sword')continue;if(n==='shoulders'&&!selected.has('arms'))over(a,tex.foreground);if(selected.has(n))over(a,tex[n])}return a}
function over(a,b){for(let i=0;i<a.length;i+=4)if(b[i+3])a.set(b.subarray(i,i+4),i)}
function render(){const a=warped(compose(),amount);for(const id of ['native','big'])document.getElementById(id).getContext('2d').putImageData(new ImageData(a,W,H),0,0);document.getElementById('status').textContent=`64×96 / 1倍　${selected.size}/10部位　接合確認 ${amount}画素`;return Array.from(a)}
for(const [i,n] of names.entries()){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.dataset.part=n;c.onchange=()=>{c.checked?selected.add(n):selected.delete(n);render()};l.append(c,DATA.labels[i]);document.getElementById('controls').append(l)}
function setParts(ns){selected=new Set(ns);for(const c of document.querySelectorAll('input'))c.checked=selected.has(c.dataset.part);return render()}
document.getElementById('all').onclick=()=>setParts(names);document.getElementById('bare').onclick=()=>setParts([]);document.getElementById('probe').onclick=()=>playing=true;document.getElementById('still').onclick=()=>{playing=false;amount=0;render()};let last=-1;function tick(t){if(playing){const frame=Math.floor(t/350)%4;if(frame!==last){last=frame;amount=[0,1,0,-1][frame];render()}}requestAnimationFrame(tick)}
document.getElementById('front').getContext('2d').putImageData(new ImageData(tex.front,W,H),0,0);render();requestAnimationFrame(tick);window.review={setParts,render,names,probe:n=>{amount=n;return render()},ready:true};
