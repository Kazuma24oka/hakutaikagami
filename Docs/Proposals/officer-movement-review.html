<!doctype html><html lang="ja"><meta charset="utf-8"><title>百代鏡・4方向移動</title><style>body{margin:24px;background:#202d32;color:#eee;font:16px system-ui}button{padding:10px;margin:6px}.scroll{overflow:auto}canvas{image-rendering:pixelated;width:1280px;height:800px}p{line-height:1.8}</style><h1>4方向の移動確認・64×96／1倍</h1><p>Godot実画面44コマの再生です。実際の操作は起動済みのGodot画面で、矢印またはWASD。キーを離すと待機。装備は4方向共通です。自動巡回中もキーで手動操作へ移れます。</p><button id="play">停止／再開</button><button id="step">1コマ送る</button><span id="status"></span><div class="scroll"><canvas id="replay" width="1280" height="800"></canvas></div><p>画像全体を縮小せず横スクロールで表示。草地・街道・河岸は表示用の仮背景で、地形衝突・合戦・世界時刻への接続は未実施。体型・顎の方向差・隠れ面も暫定です。</p><script>const images=Array.from({length:44},(_,i)=>{const im=new Image();im.src='../../Art/Officer/MovementV13/route-'+String(i).padStart(2,'0')+'.png';return im});let at=0,playing=true;const canvas=document.getElementById('replay'),ctx=canvas.getContext('2d');function draw(){if(images[at].complete&&images[at].naturalWidth){ctx.drawImage(images[at],0,0);document.getElementById('status').textContent=(at+1)+'/44'}}images[0].onload=draw;document.getElementById('play').onclick=()=>playing=!playing;document.getElementById('step').onclick=()=>{playing=false;at=(at+1)%44;draw()};setInterval(()=>{if(playing){at=(at+1)%44;draw()}},180);window.review={images,canvas,setFrame:n=>{playing=false;at=n;draw()},ready:()=>images.every(i=>i.complete&&i.naturalWidth===1280)};</script></html>
