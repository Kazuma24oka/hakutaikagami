<h1>正面・待機／歩行　64×96・通常1倍</h1><p class="line">同じ素体・顔・髪・8部位を、共通の関節制御で動かす試作です。歩行は正面での足踏み。素体の細さは保留のままです。</p>
<div><select id="clip"><option value="walk">歩行</option><option value="idle">待機</option></select><button id="play">停止</button><button id="step">1コマ進める</button><select id="speed"><option value="1">通常速度</option><option value="0.25">低速・1/4</option></select><span id="frame"></span><button data-bg="checker">市松</button><button data-bg="white">白</button><button data-bg="black">黒</button></div>
<div id="controls"></div><button id="restore">すべて戻す</button><button id="armor-off">甲冑を全部外す</button><button id="bare">顔・髪も全部外す</button>
<section class="stage"><div><p>実寸・1倍</p><canvas id="native" width="64" height="96"></canvas><p>足裏基準 y=91</p></div><div><p>確認用・4倍</p><canvas id="large" width="64" height="96"></canvas></div><div><p>同じコマで比較・1倍</p><div class="mini" id="compare"></div></div></section>
<p>全装備・全コマ（原寸）</p><div id="gallery" class="gallery"></div><details><summary>今回の制御と確認範囲</summary><p class="line">肩から手首、股から膝・足首へ連続した制御重みを使います。肌・装備・遮蔽は同じ変換を参照し、素体へ装備を焼き込みません。刀は腰に追従する剛体です。小さな振幅での正面試作であり、大きな腕振り、方向転換、ゲーム内移動は未検証です。歩行中の着脱も可能です。通常速度・低速・コマ送りで関節と重なりを比較できます。</p></details>

let gallery=[];function resetGallery(){gallery=[];$('gallery').replaceChildren();for(let i=0;i<D.rig.clips[clip].frames.length;i++){let c=make();gallery.push(c);$('gallery').append(c)}}resetGallery();
