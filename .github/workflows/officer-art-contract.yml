name: Officer art contract regression
on: [push, pull_request]
jobs:
  contract-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Scripts/officer-art-requirements.txt
      - run: python Scripts/test_officer_art_pipeline.py
      - run: python Scripts/test_officer_equipment_parts.py
      - name: Unplanned production must stay blocked
        shell: bash
        run: |
          set +e
          python Scripts/officer_art_pipeline.py --stage front_authoring
          result=$?
          test "$result" -eq 2
